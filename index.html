    :root {
        --bg-primary: #0D1B2A;
        --bg-secondary: #1A2332;
        --bg-tertiary: #2C3E50;
        --accent-teal: #00D4FF;
        --accent-green: #2ECC71;
        --accent-red: #FF6B6B;
        --text-primary: #F1F1F1;
        --text-secondary: #B0B0B0;
        --border-color: #3A4F63;
        --input-bg: #1A2332;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        line-height: 1.6;
        overflow-x: hidden;
    }

    header {
        background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
        padding: 20px;
        text-align: center;
        border-bottom: 2px solid var(--accent-teal);
        box-shadow: 0 4px 12px rgba(0, 212, 255, 0.1);
    }

    h1 {
        color: var(--accent-teal);
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.5px;
    }

    .tab-buttons {
        display: flex;
        justify-content: flex-start;
        overflow-x: auto;
        background-color: var(--bg-secondary);
        padding: 10px;
        gap: 8px;
        scroll-behavior: smooth;
        border-bottom: 1px solid var(--border-color);
    }

    .tab-button {
        background-color: var(--bg-tertiary);
        color: var(--text-secondary);
        padding: 12px 16px;
        border: none;
        cursor: pointer;
        border-radius: 8px;
        transition: all 0.3s ease;
        font-family: 'Segoe UI', sans-serif;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        flex-shrink: 0;
    }

    .tab-button:hover {
        background-color: var(--bg-primary);
        color: var(--accent-teal);
    }

    .tab-button.active {
        background-color: var(--accent-teal);
        color: var(--bg-primary);
        box-shadow: 0 4px 12px rgba(0, 212, 255, 0.3);
    }

    .tab-content {
        display: none;
        padding: 20px;
        animation: slideIn 0.3s ease;
    }

    .tab-content.active {
        display: block;
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    h2 {
        color: var(--accent-teal);
        font-size: 20px;
        margin-bottom: 20px;
        border-bottom: 2px solid var(--accent-teal);
        padding-bottom: 10px;
    }

    .form-group {
        margin-bottom: 16px;
    }

    label {
        display: block;
        color: var(--text-primary);
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 14px;
    }

    input[type="text"],
    input[type="number"],
    input[type="date"],
    input[type="month"],
    select {
        width: 100%;
        padding: 12px;
        background-color: var(--input-bg);
        color: var(--text-primary);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        font-size: 14px;
        font-family: 'Segoe UI', sans-serif;
        transition: all 0.3s ease;
    }

    input:focus,
    select:focus {
        outline: none;
        border-color: var(--accent-teal);
        box-shadow: 0 0 8px rgba(0, 212, 255, 0.2);
    }

    button {
        background-color: var(--accent-teal);
        color: var(--bg-primary);
        border: none;
        padding: 12px 24px;
        margin-top: 10px;
        cursor: pointer;
        border-radius: 6px;
        font-weight: 600;
        font-size: 14px;
        transition: all 0.3s ease;
        width: 100%;
    }

    button:hover {
        background-color: #00A8CC;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(0, 212, 255, 0.3);
    }

    .btn-danger {
        background-color: var(--accent-red);
        color: white;
        width: auto;
        padding: 8px 12px;
        font-size: 12px;
        margin: 0;
    }

    .btn-danger:hover {
        background-color: #FF5252;
    }

    .btn-secondary {
        background-color: var(--bg-tertiary);
        color: var(--text-primary);
        width: auto;
        padding: 8px 12px;
        font-size: 12px;
        margin: 0;
    }

    .btn-secondary:hover {
        background-color: #3A4F63;
    }

    .btn-success {
        background-color: var(--accent-green);

    }

    }

<script>
    // DATABASE SETUP
    const dbName = 'personalFinanceDB';
    const storeNames = {
        accounts: 'accounts',
        transfers: 'transfers',
        reminders: 'reminders',
        loans: 'loans',
        loanPayments: 'loanPayments',
        assets: 'assets',
        transactions: 'transactions',
        settings: 'settings'
    };

    let db;
    let currentMonthOffset = 0;

    function initDatabase() {
        const openDBRequest = indexedDB.open(dbName, 1);

        openDBRequest.onerror = () => alert('Error opening database');

        openDBRequest.onupgradeneeded = (event) => {
            db = event.target.result;
            
            if (!db.objectStoreNames.contains(storeNames.accounts)) {
                db.createObjectStore(storeNames.accounts, { keyPath: 'id', autoIncrement: true });
            }
            if (!db.objectStoreNames.contains(storeNames.transfers)) {
                db.createObjectStore(storeNames.transfers, { keyPath: 'id', autoIncrement: true });
            }
            if (!db.objectStoreNames.contains(storeNames.reminders)) {
                db.createObjectStore(storeNames.reminders, { keyPath: 'id', autoIncrement: true });
            }
            if (!db.objectStoreNames.contains(storeNames.loans)) {
                db.createObjectStore(storeNames.loans, { keyPath: 'id', autoIncrement: true });
            }
            if (!db.objectStoreNames.contains(storeNames.loanPayments)) {
                db.createObjectStore(storeNames.loanPayments, { keyPath: 'id', autoIncrement: true });
            }
            if (!db.objectStoreNames.contains(storeNames.assets)) {
                db.createObjectStore(storeNames.assets, { keyPath: 'id', autoIncrement: true });
            }
            if (!db.objectStoreNames.contains(storeNames.transactions)) {
                db.createObjectStore(storeNames.transactions, { keyPath: 'id', autoIncrement: true });
            }
            if (!db.objectStoreNames.contains(storeNames.settings)) {
                db.createObjectStore(storeNames.settings, { keyPath: 'key' });
            }
        };

        openDBRequest.onsuccess = (event) => {
            db = event.target.result;
            initializeApp();
        };
    }

    function initializeApp() {
        processAutoIncrements();
        loadAccountsList();
        loadIncomeSettings();
        loadTransfersList();
        loadRemindersList();
        loadLoansList();
        loadAssetsList();
        updateDashboard();
        updateAllSelects();
        setTodayDate();
    }

    function setTodayDate() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('transferDate').value = today;
    }

    function showTab(tabId) {
        const tabs = document.querySelectorAll('.tab-content');
        tabs.forEach(tab => tab.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');

        const buttons = document.querySelectorAll('.tab-button');
        buttons.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        if (tabId === 'dashboard') {
            updateDashboard();
        } else if (tabId === 'history') {
            const today = new Date();
            const monthStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0');
            document.getElementById('historyMonth').value = monthStr;
            filterHistory();
        }
    }

    // TAB NAVIGATION
    function showTab(tabId) {
        const tabs = document.querySelectorAll('.tab-content');
        tabs.forEach(tab => tab.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');

        const buttons = document.querySelectorAll('.tab-button');
        buttons.forEach(btn => btn.classList.remove('active'));
        
        const clickedBtn = Array.from(buttons).find(btn => {
            const tabName = btn.getAttribute('onclick').match(/'([^']+)'/)[1];
            return tabName === tabId;
        });
        if (clickedBtn) clickedBtn.classList.add('active');

        if (tabId === 'dashboard') {
            updateDashboard();
        } else if (tabId === 'history') {
            const today = new Date();
            const monthStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0');
            document.getElementById('historyMonth').value = monthStr;
            filterHistory();
        }
    }

    // TRANSFERS MANAGEMENT
    function addTransfer() {
        const fromId = parseInt(document.getElementById('transferFrom').value);
        const toId = parseInt(document.getElementById('transferTo').value);
        const amount = parseFloat(document.getElementById('transferAmount').value);
        const date = document.getElementById('transferDate').value;

        if (!fromId || !toId || !amount || !date || fromId === toId) {
            alert('Please fill all fields correctly (accounts must be different)');
            return;
        }

        const transaction = db.transaction([storeNames.accounts, storeNames.transfers, storeNames.transactions], 'readwrite');
        const accountsStore = transaction.objectStore(storeNames.accounts);
        const transfersStore = transaction.objectStore(storeNames.transfers);
        const transactionsStore = transaction.objectStore(storeNames.transactions);

        const fromReq = accountsStore.get(fromId);
        fromReq.onsuccess = () => {
            const fromAcc = fromReq.result;
            if (fromAcc.balance < amount) {
                alert('Insufficient balance in ' + fromAcc.name);
                return;
            }

            const toReq = accountsStore.get(toId);
            toReq.onsuccess = () => {
                const toAcc = toReq.result;

                // Update balances
                fromAcc.balance -= amount;
                toAcc.balance += amount;
                accountsStore.put(fromAcc);
                accountsStore.put(toAcc);

                // Add transfer record
                transfersStore.add({
                    fromId, toId, amount, date,
                    fromName: fromAcc.name,
                    toName: toAcc.name
                });

                // Add transaction
                transactionsStore.add({
                    type: 'Transfer',
                    amount: amount,
                    description: `${fromAcc.name} → ${toAcc.name}`,
                    fromAccount: fromAcc.name,
                    toAccount: toAcc.name,
                    date: date,
                    createdAt: new Date()
                });
            };
        };

        transaction.oncomplete = () => {
            document.getElementById('transferAmount').value = '';
            loadTransfersList();
            updateDashboard();
            loadAccountsList();
        };
    }

    function editTransfer(id) {
        const transaction = db.transaction([storeNames.transfers, storeNames.accounts], 'readwrite');
        const store = transaction.objectStore(storeNames.transfers);
        const accountsStore = transaction.objectStore(storeNames.accounts);

        const req = store.get(id);
        req.onsuccess = () => {
            const transfer = req.result;
            const newAmount = prompt('Edit transfer amount:', transfer.amount);
            if (newAmount === null) return;

            const newAmountNum = parseFloat(newAmount);
            const difference = newAmountNum - transfer.amount;

            const fromReq = accountsStore.get(transfer.fromId);
            fromReq.onsuccess = () => {
                const fromAcc = fromReq.result;
                if (fromAcc.balance < difference) {
                    alert('Insufficient balance');
                    return;
                }

                const toReq = accountsStore.get(transfer.toId);
                toReq.onsuccess = () => {
                    const toAcc = toReq.result;
                    fromAcc.balance -= difference;
                    toAcc.balance += difference;
                    accountsStore.put(fromAcc);
                    accountsStore.put(toAcc);

                    transfer.amount = newAmountNum;
                    store.put(transfer);

                    transaction.oncomplete = () => {
                        loadTransfersList();
                        loadAccountsList();
                        updateDashboard();
                    };
                };
            };
        };
    }

    function deleteTransfer(id) {
        if (!confirm('Delete this transfer?')) return;

        const transaction = db.transaction([storeNames.transfers, storeNames.accounts], 'readwrite');
        const store = transaction.objectStore(storeNames.transfers);
        const accountsStore = transaction.objectStore(storeNames.accounts);

        const req = store.get(id);
        req.onsuccess = () => {
            const transfer = req.result;

            const fromReq = accountsStore.get(transfer.fromId);
            fromReq.onsuccess = () => {
                const fromAcc = fromReq.result;
                const toReq = accountsStore.get(transfer.toId);
                toReq.onsuccess = () => {
                    const toAcc = toReq.result;
                    fromAcc.balance += transfer.amount;
                    toAcc.balance -= transfer.amount;
                    accountsStore.put(fromAcc);
                    accountsStore.put(toAcc);

                    store.delete(id);

                    transaction.oncomplete = () => {
                        loadTransfersList();
                        loadAccountsList();
                        updateDashboard();
                    };
                };
            };
        };
    }

    function toggleReminderPaid(id, paid) {
        const transaction = db.transaction([storeNames.reminders, storeNames.accounts, storeNames.transactions], 'readwrite');
        const remindersStore = transaction.objectStore(storeNames.reminders);
        const accountsStore = transaction.objectStore(storeNames.accounts);
        const transactionsStore = transaction.objectStore(storeNames.transactions);

        const req = remindersStore.get(id);
        req.onsuccess = () => {
            const reminder = req.result;
            const previousPaid = reminder.paid;
            reminder.paid = paid;

            if (paid && !previousPaid) {
                // Mark as paid
                const accReq = accountsStore.get(reminder.accountId);
                accReq.onsuccess = () => {
                    const account = accReq.result;
                    account.balance -= reminder.amount;
                    accountsStore.put(account);

                    transactionsStore.add({
                        type: 'Reminder Paid',
                        amount: reminder.amount,
                        description: reminder.name,
                        fromAccount: account.name,
                        date: new Date().toISOString().split('T')[0],
                        createdAt: new Date()
                    });

                    remindersStore.put(reminder);
                };
            } else if (!paid && previousPaid) {
                // Unmark as paid - refund
                const accReq = accountsStore.get(reminder.accountId);
                accReq.onsuccess = () => {
                    const account = accReq.result;
                    account.balance += reminder.amount;
                    accountsStore.put(account);
                    remindersStore.put(reminder);
                };
            }
        };

        transaction.oncomplete = () => {
            loadRemindersList();
            updateDashboard();
        };
    }

    function addLoanPayment(loanId) {
        const amount = prompt('Enter payment amount (₹):');
        if (amount === null || parseFloat(amount) <= 0) return;

        const transaction = db.transaction([storeNames.loans, storeNames.accounts, storeNames.transactions], 'readwrite');
        const loansStore = transaction.objectStore(storeNames.loans);
        const accountsStore = transaction.objectStore(storeNames.accounts);
        const transactionsStore = transaction.objectStore(storeNames.transactions);

        const loanReq = loansStore.get(loanId);
        loanReq.onsuccess = () => {
            const loan = loanReq.result;
            const paymentAmount = parseFloat(amount);

            loan.paidAmount = (loan.paidAmount || 0) + paymentAmount;
            loansStore.put(loan);

            const accReq = accountsStore.get(loan.accountId);
            accReq.onsuccess = () => {
                const account = accReq.result;
                account.balance -= paymentAmount;
                accountsStore.put(account);

                transactionsStore.add({
                    type: 'Loan Payment',
                    amount: paymentAmount,
                    description: loan.name,
                    fromAccount: account.name,
                    date: new Date().toISOString().split('T')[0],
                    createdAt: new Date()
                });
            };
        };

        transaction.oncomplete = () => {
            loadLoansList();
            loadAccountsList();
            updateDashboard();
        };
    }

    // AUTO PROCESSING
    function processAutoIncrements() {
        const today = new Date();
        const dayOfMonth = today.getDate();

        const transaction = db.transaction([storeNames.settings, storeNames.accounts, storeNames.transactions, storeNames.loans], 'readwrite');
        const settingsStore = transaction.objectStore(storeNames.settings);
        const accountsStore = transaction.objectStore(storeNames.accounts);
        const transactionsStore = transaction.objectStore(storeNames.transactions);
        const loansStore = transaction.objectStore(storeNames.loans);

        // Process Salary
        const salaryReq = settingsStore.get('salary');
        salaryReq.onsuccess = () => {
            const salary = salaryReq.result;
            if (salary && salary.date === dayOfMonth) {
                const dateStr = today.toISOString().split('T')[0];
                const txnReq = transactionsStore.getAll();
                txnReq.onsuccess = () => {
                    const existsToday = txnReq.result.some(t => t.type === 'Salary' && t.date === dateStr);
                    if (!existsToday) {
                        const accReq = accountsStore.get(salary.accountId);
                        accReq.onsuccess = () => {
                            const account = accReq.result;
                            account.balance += salary.amount;
                            accountsStore.put(account);

                            transactionsStore.add({
                                type: 'Salary',
                                amount: salary.amount,
                                description: 'Monthly Salary',
                                fromAccount: account.name,
                                date: dateStr,
                                createdAt: new Date()
                            });
                        };
                    }
                };
            }
        };

        // Process EPF
        const epfReq = settingsStore.get('epf');
        epfReq.onsuccess = () => {
            const epf = epfReq.result;
            if (epf && epf.date === dayOfMonth) {
                const dateStr = today.toISOString().split('T')[0];
                const txnReq = transactionsStore.getAll();
                txnReq.onsuccess = () => {
                    const existsToday = txnReq.result.some(t => t.type === 'EPF Added' && t.date === dateStr);
                    if (!existsToday) {
                        transactionsStore.add({
                            type: 'EPF Added',
                            amount: epf.amount,
                            description: 'Monthly EPF',
                            fromAccount: 'EPF',
                            date: dateStr,
                            createdAt: new Date()
                        });
                    }
                };
            }
        };

        // Process Loan EMIs
        const loansReq = loansStore.getAll();
        loansReq.onsuccess = () => {
            const loans = loansReq.result;
            loans.forEach(loan => {
                if (loan.emiAmount > 0 && loan.emiDate === dayOfMonth) {
                    const dateStr = today.toISOString().split('T')[0];
                    const txnReq = transactionsStore.getAll();
                    txnReq.onsuccess = () => {
                        const existsToday = txnReq.result.some(t => t.type === 'Loan EMI' && t.date === dateStr && t.description === loan.name);
                        if (!existsToday) {
                            const accReq = accountsStore.get(loan.accountId);
                            accReq.onsuccess = () => {
                                const account = accReq.result;
                                account.balance -= loan.emiAmount;
                                accountsStore.put(account);

                                loan.paidAmount = (loan.paidAmount || 0) + loan.emiAmount;
                                loansStore.put(loan);

                                transactionsStore.add({
                                    type: 'Loan EMI',
                                    amount: loan.emiAmount,
                                    description: loan.name,
                                    fromAccount: account.name,
                                    date: dateStr,
                                    createdAt: new Date()
                                });
                            };
                        }
                    };
                }
            });
        };
    }

    function addTransaction(type, amount, description, account) {
        const transaction = db.transaction(storeNames.transactions, 'readwrite');
        const store = transaction.objectStore(storeNames.transactions);

        store.add({
            type, amount, description,
            fromAccount: account,
            date: new Date().toISOString().split('T')[0],
            createdAt: new Date()
        });
    }

    // HISTORY
    function filterHistory() {
        const monthStr = document.getElementById('historyMonth').value;
        if (!monthStr) return;

        const transaction = db.transaction(storeNames.transactions, 'readonly');
        const store = transaction.objectStore(storeNames.transactions);
        const request = store.getAll();

        request.onsuccess = () => {
            const allTransactions = request.result;
            const filtered = allTransactions.filter(t => {
                return t.date && t.date.startsWith(monthStr);
            }).sort((a, b) => new Date(b.date) - new Date(a.date));

            const html = `
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Type</th>
                            <th>Description</th>
                            <th>Amount</th>
                            <th>Account</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${filtered.map(t => `
                            <tr>
                                <td>${t.date}</td>
                                <td>${t.type}</td>
                                <td>${t.description}</td>
                                <td class="${t.type.includes('EMI') || t.type === 'Loan Payment' || t.type === 'Reminder Paid' ? 'amount-negative' : 'amount-positive'}">
                                    ${t.type.includes('EMI') || t.type === 'Loan Payment' || t.type === 'Reminder Paid' ? '-' : '+'}₹${Math.abs(t.amount).toLocaleString('en-IN', {maximumFractionDigits: 0})}
                                </td>
                                <td>${t.fromAccount}</td>
                                <td>
                                    <button class="btn-secondary" onclick="editTransaction(${t.id})">Edit</button>
                                    <button class="btn-danger" onclick="deleteTransaction(${t.id})">Delete</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            document.getElementById('historyTable').innerHTML = filtered.length > 0 ? html : '<div class="empty-state">No transactions found</div>';
        };
    }

    function editTransaction(id) {
        const transaction = db.transaction(storeNames.transactions, 'readwrite');
        const store = transaction.objectStore(storeNames.transactions);
        const req = store.get(id);

        req.onsuccess = () => {
            const txn = req.result;
            const newAmount = prompt('Edit amount:', txn.amount);
            if (newAmount === null) return;

            txn.amount = parseFloat(newAmount);
            store.put(txn);

            transaction.oncomplete = () => {
                filterHistory();
                updateDashboard();
            };
        };
    }

    function deleteTransaction(id) {
        if (!confirm('Delete this transaction?')) return;

        const transaction = db.transaction(storeNames.transactions, 'readwrite');
        const store = transaction.objectStore(storeNames.transactions);
        store.delete(id);

        transaction.oncomplete = () => {
            filterHistory();
            updateDashboard();
        };
    }

    // DASHBOARD
    function updateDashboard() {
        const transaction = db.transaction([storeNames.accounts, storeNames.assets, storeNames.loans, storeNames.transactions, storeNames.reminders], 'readonly');
        const accountsStore = transaction.objectStore(storeNames.accounts);
        const assetsStore = transaction.objectStore(storeNames.assets);
        const loansStore = transaction.objectStore(storeNames.loans);
        const transactionsStore = transaction.objectStore(storeNames.transactions);
        const remindersStore = transaction.objectStore(storeNames.reminders);

        const accountsReq = accountsStore.getAll();
        const assetsReq = assetsStore.getAll();
        const loansReq = loansStore.getAll();
        const transactionsReq = transactionsStore.getAll();
        const remindersReq = remindersStore.getAll();

        let totalAssets = 0;
        let totalLiabilities = 0;

        accountsReq.onsuccess = () => {
            const accounts = accountsReq.result;
            totalAssets += accounts.reduce((sum, acc) => sum + acc.balance, 0);

            assetsReq.onsuccess = () => {
                const assets = assetsReq.result;
                totalAssets += assets.reduce((sum, asset) => sum + asset.value, 0);

                // Add EPF
                transactionsReq.onsuccess = () => {
                    const transactions = transactionsReq.result;
                    const epfAmount = transactions.filter(t => t.type === 'EPF Added').reduce((sum, t) => sum + t.amount, 0);
                    totalAssets += epfAmount;

                    loansReq.onsuccess = () => {
                        const loans = loansReq.result;
                        totalLiabilities = loans.reduce((sum, loan) => sum + (loan.totalAmount - (loan.paidAmount || 0)), 0);

                        const netWorth = totalAssets - totalLiabilities;

                        document.getElementById('totalAssets').textContent = '₹' + totalAssets.toLocaleString('en-IN', {maximumFractionDigits: 0});
                        document.getElementById('totalLiabilities').textContent = '₹' + totalLiabilities.toLocaleString('en-IN', {maximumFractionDigits: 0});
                        document.getElementById('netWorth').textContent = '₹' + netWorth.toLocaleString('en-IN', {maximumFractionDigits: 0});

                        remindersReq.onsuccess = () => {
                            const reminders = remindersReq.result;
                            updateUpcomingReminders(reminders);
                        };
                    };
                };
            };
        };
    }

    function updateUpcomingReminders(allReminders) {
        const today = new Date();
        const currentMonth = today.getMonth();
        const currentYear = today.getFullYear();
        const currentDay = today.getDate();

        let displayDate = new Date(currentYear, currentMonth + currentMonthOffset, 1);
        let displayMonth = displayDate.getMonth();
        let displayYear = displayDate.getFullYear();

        const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        document.getElementById('reminderMonthDisplay').textContent = monthNames[displayMonth] + ' ' + displayYear;

        const relevant = allReminders.filter(r => {
            if (r.frequency === 'once') return false;
            if (r.frequency === 'monthly') return true;
            if (r.frequency === 'yearly') {
                const reminderDate = new Date(displayYear, displayMonth, r.day);
                return reminderDate.getMonth() === displayMonth;
            }
            return false;
        });

        const html = relevant.map(r => `
            <div class="reminder-item">
                <div class="reminder-info">
                    <div class="reminder-date">${String(r.day).padStart(2, '0')} ${monthNames[displayMonth]}</div>
                    <div class="reminder-name">${r.name}</div>
                    <div class="reminder-amount">₹${r.amount.toLocaleString('en-IN', {maximumFractionDigits: 0})}</div>
                </div>
                <input type="checkbox" class="reminder-checkbox" ${r.paid ? 'checked' : ''} onchange="toggleReminderPaid(${r.id}, this.checked)">
            </div>
        `).join('');

        document.getElementById('upcomingReminders').innerHTML = html || '<div class="empty-state">No reminders this month</div>';
    }

    function previousMonth() {
        currentMonthOffset--;
        const transaction = db.transaction(storeNames.reminders, 'readonly');
        const store = transaction.objectStore(storeNames.reminders);
        const request = store.getAll();

        request.onsuccess = () => {
            updateUpcomingReminders(request.result);
        };
    }

    function nextMonth() {
        currentMonthOffset++;
        const transaction = db.transaction(storeNames.reminders, 'readonly');
        const store = transaction.objectStore(storeNames.reminders);
        const request = store.getAll();

        request.onsuccess = () => {
            updateUpcomingReminders(request.result);
        };
    }

    // EXPORT & IMPORT
    function exportData() {
        const transaction = db.transaction(Object.values(storeNames), 'readonly');
        const exportedData = {};

        let completed = 0;
        const total = Object.keys(storeNames).length;

        Object.values(storeNames).forEach(storeName => {
            const store = transaction.objectStore(storeName);
            const request = store.getAll();

            request.onsuccess = () => {
                exportedData[storeName] = request.result;
                completed++;

                if (completed === total) {
                    const jsonData = JSON.stringify(exportedData, null, 2);
                    const blob = new Blob([jsonData], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);

                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'finance_data.json';
                    a.click();

                    URL.revokeObjectURL(url);
                }
            };
        });
    }

    function importData() {
        const fileInput = document.getElementById('jsonFileInput');
        const file = fileInput.files[0];

        if (!file) {
            alert('Please select a file');
            return;
        }

        const reader = new FileReader();
        reader.onload = (event) => {
            try {
                const importedData = JSON.parse(event.target.result);

                const transaction = db.transaction(Object.values(storeNames), 'readwrite');
                let completed = 0;
                const total = Object.keys(storeNames).length;

                Object.keys(storeNames).forEach(key => {
                    const storeName = storeNames[key];
                    if (importedData[storeName]) {
                        const store = transaction.objectStore(storeName);
                        importedData[storeName].forEach(record => {
                            store.add(record);
                        });
                    }
                    completed++;
                });

                transaction.oncomplete = () => {
                    alert('Data imported successfully');
                    location.reload();
                };
            } catch (error) {
                alert('Error importing data: ' + error.message);
            }
        };

        reader.readAsText(file);
    }

    function clearAllData() {
        if (!confirm('This will delete ALL data. Are you sure?')) return;

        const transaction = db.transaction(Object.values(storeNames), 'readwrite');

        Object.values(storeNames).forEach(storeName => {
            const store = transaction.objectStore(storeName);
            store.clear();
        });

        transaction.oncomplete = () => {
            alert('All data cleared');
            location.reload();
        };
    }

    // INITIALIZE
    initDatabase();
</script>
